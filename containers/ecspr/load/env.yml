channels:
  - conda-forge
dependencies:
  - python=3.12
  # numpy >= 2 matches the environment these artifacts were BUILT under, and the
  # rest of the stack. Note the often-repeated reason for the pin -- "numpy 1.26
  # cannot unpickle the numpy-2 base graphs" -- is FALSE and was checked: the
  # bipartite/base-graph pickles hold plain networkx graphs of Python floats and
  # carry no numpy module references at all, so they load fine under 1.26. The
  # real version constraint on those files is networkx, not numpy. Pin numpy
  # forward anyway (no reason to go backwards), but do not repeat the false claim.
  - numpy>=2
  - pandas
  - scipy
  - scikit-learn
  - scikit-sparse
  - networkx
  - pyarrow
  - pip
  # torch is pip-installed in the Dockerfile, NOT here: it must come from the cu128
  # wheel index. That pin IS load-bearing -- the current default CUDA build breaks
  # the V100 driver on the target cluster.
