degraded_mode: Without it the direction ensemble loses its curated member. The annotator is
  a 3-member ratio (eQuilibrator + dGbyG + BioCyc), combined as a ratio rather than a gate,
  so it still produces a direction for every reaction -- but the curated member is the only
  one carrying human-checked irreversibility, so reactions whose thermodynamics are ambiguous
  lose their tie-break and fall toward ratio 1.0 (reversible). The directed solve then approaches
  the undirected one on exactly those edges.
