resolution: >-
  Pushed to quay from the local daemon as-is, 25.8 GB. This also resolves the
  weights problem it used to state: CLEAN's weights are baked into the image
  rather than shipped separately, so putting the image on a registry is the
  only thing that makes the weights obtainable at all. The digest is the amd64
  Descriptor.digest read back FROM the registry; the enclosing OCI index digest
  is sha256:ac9bf1a3e51be674dd1e5902b905e3c776caa4361435d00f38298649831aa8a1,
  which is also the local image id and is deliberately not what is pinned.
  The recipe still lives in container_builds/main/clean and is SHARED with
  metasmith-libraries/deep-learning and scadc/functional-analysis -- it is
  pinned here, never vendored.
